apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-api-deployment
spec:
  replicas: 2 # Autopilot mantendrá SIEMPRE 2 instancias de la API corriendo. Si una falla, la reinicia.
  selector:
    matchLabels:
      app: mi-api
  template:
    metadata:
      labels:
        app: mi-api
    spec:
      containers:
      - name: contenedor-java
        image: us-central1-docker.pkg.dev/ID_DE_TU_PROYECTO/mi-repo-java/mi-imagen:v1
        ports:
        - containerPort: 8080 # El puerto donde escucha el JAR
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: java-api-service
spec:
  type: LoadBalancer # Esto le pide a Google Cloud que cree una IP pública de internet
  selector:
    app: mi-api
  ports:
    - protocol: TCP
      port: 80      # Puerto externo (Público)
      targetPort: 8080 # Puerto interno (Tu app)
